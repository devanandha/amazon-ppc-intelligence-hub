name: Validate PPC app

on:
  push:
    branches: [feature/premium-dashboard-scenario-lab]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py ui_theme.py landing_experience.py create_synthetic_demo.py ml_insights.py decision_assurance.py evidence_report.py tests
      - name: Check synthetic demo
        run: python -m unittest discover -s tests -v
